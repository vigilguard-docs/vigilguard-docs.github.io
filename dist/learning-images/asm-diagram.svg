<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460"><path fill="var(--bg-primary, #0b0c0e)" d="M0 0h680v460H0z"/><text x="340" y="36" fill="var(--text-primary, #ffffff)" font-family="Space Grotesk,sans-serif" font-size="13" font-weight="700" text-anchor="middle">ASM — THE COMPLETE ATTACK SURFACE</text><text x="340" y="52" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">EASM covers the external slice. ASM is the full picture — internal and external.</text><rect width="270" height="330" x="40" y="70" fill="var(--bg-secondary, #1a1b26)" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" rx="8"/><text x="175" y="94" fill="var(--brand-purple, #7367f0)" font-family="Space Grotesk,sans-serif" font-size="11" font-weight="700" text-anchor="middle">EXTERNAL SURFACE</text><text x="175" y="108" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Internet-facing · Attacker-visible</text><rect width="230" height="24" x="60" y="120" fill="var(--bg-primary, #0b0c0e)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="4"/><text x="175" y="136" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">Domains &amp; Subdomains</text><rect width="230" height="24" x="60" y="152" fill="var(--bg-primary, #0b0c0e)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="4"/><text x="175" y="168" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">IP Ranges · ASN blocks</text><rect width="230" height="24" x="60" y="184" fill="var(--bg-primary, #0b0c0e)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="4"/><text x="175" y="200" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">Exposed APIs &amp; Services</text><rect width="230" height="24" x="60" y="216" fill="var(--bg-primary, #0b0c0e)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="4"/><text x="175" y="232" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">TLS Certificates</text><rect width="230" height="24" x="60" y="248" fill="var(--bg-primary, #0b0c0e)" stroke="#e24b4a" stroke-width="1.2" rx="4"/><text x="175" y="264" fill="#e24b4a" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">Forgotten assets · Shadow IT</text><rect width="230" height="24" x="60" y="280" fill="var(--bg-primary, #0b0c0e)" stroke="#e24b4a" stroke-width="1.2" rx="4"/><text x="175" y="296" fill="#e24b4a" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">Cloud misconfigurations</text><rect width="230" height="24" x="60" y="312" fill="var(--bg-primary, #0b0c0e)" stroke="#e24b4a" stroke-width="1.2" rx="4"/><text x="175" y="328" fill="#e24b4a" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">Dangling DNS · Subdomain takeover</text><rect width="230" height="24" x="60" y="344" fill="var(--bg-primary, #0b0c0e)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="4"/><text x="175" y="360" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">Third-party exposure</text><text x="340" y="240" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">+</text><rect width="270" height="330" x="370" y="70" fill="var(--bg-secondary, #1a1b26)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="8"/><text x="505" y="94" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="11" font-weight="700" text-anchor="middle">INTERNAL SURFACE</text><text x="505" y="108" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Behind the perimeter · Post-breach risk</text><rect width="230" height="24" x="390" y="120" fill="var(--bg-primary, #0b0c0e)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="4"/><text x="505" y="136" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">Servers · Workstations</text><rect width="230" height="24" x="390" y="152" fill="var(--bg-primary, #0b0c0e)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="4"/><text x="505" y="168" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">Internal applications</text><rect width="230" height="24" x="390" y="184" fill="var(--bg-primary, #0b0c0e)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="4"/><text x="505" y="200" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">Databases · File shares</text><rect width="230" height="24" x="390" y="216" fill="var(--bg-primary, #0b0c0e)" stroke="#e24b4a" stroke-width="1.2" rx="4"/><text x="505" y="232" fill="#e24b4a" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">Overprivileged service accounts</text><rect width="230" height="24" x="390" y="248" fill="var(--bg-primary, #0b0c0e)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="4"/><text x="505" y="264" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">Network devices · OT systems</text><rect width="230" height="24" x="390" y="280" fill="var(--bg-primary, #0b0c0e)" stroke="#e24b4a" stroke-width="1.2" rx="4"/><text x="505" y="296" fill="#e24b4a" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">Unmanaged endpoints</text><rect width="230" height="24" x="390" y="312" fill="var(--bg-primary, #0b0c0e)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="4"/><text x="505" y="328" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">API keys · Hardcoded credentials</text><rect width="230" height="24" x="390" y="344" fill="var(--bg-primary, #0b0c0e)" stroke="#e24b4a" stroke-width="1.2" rx="4"/><text x="505" y="360" fill="#e24b4a" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">Unsanctioned SaaS · Shadow apps</text><rect width="10" height="10" x="40" y="418" fill="#e24b4a" opacity=".4" rx="2"/><text x="56" y="428" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9">High-risk exposure — requires immediate inventory and monitoring</text><text x="340" y="450" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">ASM without continuous discovery is a spreadsheet. The surface changes daily.</text></svg>