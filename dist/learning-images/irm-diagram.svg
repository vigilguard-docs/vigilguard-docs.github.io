00" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">IRM translates technical exposure into financial risk the board can act on.</text><text x="340" y="416" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Every risk needs a named owner, a financial estimate, and a documented response decision.</text></svg>