  <text x="25" y="98" font-size="7.5" class="t2">sqli.union.extract</text>
  <circle cx="19" cy="108" r="2.5" fill="#0096c7"/>
  <text x="25" y="111" font-size="7.5" class="t2">vendor.bcp.missing</text>

