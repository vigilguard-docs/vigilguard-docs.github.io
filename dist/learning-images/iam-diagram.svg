<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480"><defs><marker id="a" markerHeight="5" markerWidth="5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="var(--brand-purple, #7367f0)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="m2 1 6 4-6 4"/></marker></defs><path fill="var(--bg-primary, #0b0c0e)" d="M0 0h680v480H0z"/><text x="340" y="36" fill="var(--text-primary, #ffffff)" font-family="Space Grotesk,sans-serif" font-size="13" font-weight="700" text-anchor="middle">IAM — IDENTITY AS THE ATTACK SURFACE</text><text x="340" y="52" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">Attackers don&apos;t break in. They log in. Identity is the new perimeter.</text><rect width="160" height="320" x="40" y="70" fill="var(--bg-secondary, #1a1b26)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="8"/><text x="120" y="92" fill="var(--brand-purple, #7367f0)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">IDENTITY TYPES</text><rect width="128" height="28" x="56" y="104" fill="var(--bg-primary, #0b0c0e)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="4"/><text x="120" y="122" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Human users</text><rect width="128" height="28" x="56" y="140" fill="var(--bg-primary, #0b0c0e)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="4"/><text x="120" y="158" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Service accounts</text><rect width="128" height="28" x="56" y="176" fill="var(--bg-primary, #0b0c0e)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="4"/><text x="120" y="194" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">API keys · Tokens</text><rect width="128" height="28" x="56" y="212" fill="var(--bg-primary, #0b0c0e)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="4"/><text x="120" y="230" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">CI/CD pipelines</text><rect width="128" height="28" x="56" y="248" fill="var(--bg-primary, #0b0c0e)" stroke="#e24b4a" stroke-width="1.2" rx="4"/><text x="120" y="266" fill="#e24b4a" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Dormant accounts</text><rect width="128" height="28" x="56" y="284" fill="var(--bg-primary, #0b0c0e)" stroke="#e24b4a" stroke-width="1.2" rx="4"/><text x="120" y="302" fill="#e24b4a" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Over-privileged roles</text><rect width="128" height="28" x="56" y="320" fill="var(--bg-primary, #0b0c0e)" stroke="#e24b4a" stroke-width="1.2" rx="4"/><text x="120" y="338" fill="#e24b4a" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">OAuth grants</text><rect width="200" height="320" x="240" y="70" fill="var(--bg-secondary, #1a1b26)" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" rx="8"/><text x="340" y="92" fill="var(--brand-purple, #7367f0)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">IAM CONTROLS</text><rect width="168" height="32" x="256" y="108" fill="var(--bg-primary, #0b0c0e)" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" rx="4"/><text x="340" y="122" fill="var(--brand-purple, #7367f0)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">Phishing-resistant MFA</text><text x="340" y="134" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">Hardware keys · Passkeys</text><rect width="168" height="32" x="256" y="148" fill="var(--bg-primary, #0b0c0e)" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" rx="4"/><text x="340" y="162" fill="var(--brand-purple, #7367f0)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">Least Privilege Access</text><text x="340" y="174" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">Minimum required · Nothing more</text><rect width="168" height="32" x="256" y="188" fill="var(--bg-primary, #0b0c0e)" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" rx="4"/><text x="340" y="202" fill="var(--brand-purple, #7367f0)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">PAM</text><text x="340" y="214" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">JIT · Vaulting · Session recording</text><rect width="168" height="32" x="256" y="228" fill="var(--bg-primary, #0b0c0e)" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" rx="4"/><text x="340" y="242" fill="var(--brand-purple, #7367f0)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">Lifecycle Management</text><text x="340" y="254" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">Joiner · Mover · Leaver</text><rect width="168" height="32" x="256" y="268" fill="var(--bg-primary, #0b0c0e)" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" rx="4"/><text x="340" y="282" fill="var(--brand-purple, #7367f0)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">Access Reviews</text><text x="340" y="294" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">Continuous · Auto-revoke stale access</text><rect width="168" height="32" x="256" y="308" fill="var(--bg-primary, #0b0c0e)" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" rx="4"/><text x="340" y="322" fill="var(--brand-purple, #7367f0)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">ITDR</text><text x="340" y="334" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">Identity threat detection &amp; response</text><path fill="none" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" marker-end="url(#a)" d="M200 230h38" opacity=".9"/><rect width="160" height="320" x="480" y="70" fill="var(--bg-secondary, #1a1b26)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="8"/><text x="560" y="92" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">OUTCOMES</text><rect width="128" height="36" x="496" y="108" fill="var(--bg-primary, #0b0c0e)" stroke="#2ec97a" stroke-width="1.2" rx="4"/><text x="560" y="124" fill="#2ec97a" font-family="Space Grotesk,sans-serif" font-size="9" font-weight="700" text-anchor="middle">Breach prevented</text><text x="560" y="138" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">Credential theft fails</text><rect width="128" height="36" x="496" y="152" fill="var(--bg-primary, #0b0c0e)" stroke="#2ec97a" stroke-width="1.2" rx="4"/><text x="560" y="168" fill="#2ec97a" font-family="Space Grotesk,sans-serif" font-size="9" font-weight="700" text-anchor="middle">Blast radius limited</text><text x="560" y="182" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">Least privilege contains damage</text><rect width="128" height="36" x="496" y="196" fill="var(--bg-primary, #0b0c0e)" stroke="#2ec97a" stroke-width="1.2" rx="4"/><text x="560" y="212" fill="#2ec97a" font-family="Space Grotesk,sans-serif" font-size="9" font-weight="700" text-anchor="middle">Early detection</text><text x="560" y="226" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">Anomaly flagged by ITDR</text><rect width="128" height="36" x="496" y="240" fill="var(--bg-primary, #0b0c0e)" stroke="#e24b4a" stroke-width="1.2" rx="4"/><text x="560" y="256" fill="#e24b4a" font-family="Space Grotesk,sans-serif" font-size="9" font-weight="700" text-anchor="middle">Credential breach</text><text x="560" y="270" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">No MFA · Password only</text><rect width="128" height="36" x="496" y="284" fill="var(--bg-primary, #0b0c0e)" stroke="#e24b4a" stroke-width="1.2" rx="4"/><text x="560" y="300" fill="#e24b4a" font-family="Space Grotesk,sans-serif" font-size="9" font-weight="700" text-anchor="middle">Lateral movement</text><text x="560" y="314" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">Excess privileges exploited</text><rect width="128" height="36" x="496" y="328" fill="var(--bg-primary, #0b0c0e)" stroke="#e24b4a" stroke-width="1.2" rx="4"/><text x="560" y="344" fill="#e24b4a" font-family="Space Grotesk,sans-serif" font-size="9" font-weight="700" text-anchor="middle">Silent compromise</text><text x="560" y="358" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">Dormant account abused</text><path fill="none" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" marker-end="url(#a)" d="M440 230h38" opacity=".9"/><text x="340" y="418" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Non-human identities now outnumber human identities in most enterprise environments.</text><text x="340" y="434" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Service accounts, API keys, and OAuth grants are the fastest-growing attack surface in IAM.</text><text x="340" y="460" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Apply the same lifecycle management to non-human identities as to human ones.</text></svg>