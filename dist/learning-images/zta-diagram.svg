<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480"><defs><marker id="a" markerHeight="5" markerWidth="5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="var(--brand-purple, #7367f0)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="m2 1 6 4-6 4"/></marker><marker id="c" markerHeight="5" markerWidth="5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#e24b4a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="m2 1 6 4-6 4"/></marker><marker id="b" markerHeight="5" markerWidth="5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#2ec97a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="m2 1 6 4-6 4"/></marker></defs><path fill="var(--bg-primary, #0b0c0e)" d="M0 0h680v480H0z"/><text x="340" y="36" fill="var(--text-primary, #ffffff)" font-family="Space Grotesk,sans-serif" font-size="13" font-weight="700" text-anchor="middle">ZERO TRUST ARCHITECTURE — FIVE PILLARS</text><text x="340" y="52" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">Never trust, always verify — every request, every time, regardless of network location</text><rect width="100" height="36" x="40" y="68" fill="var(--bg-secondary, #1a1b26)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="6"/><text x="90" y="83" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" font-weight="700" text-anchor="middle">ACCESS</text><text x="90" y="97" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" font-weight="700" text-anchor="middle">REQUEST</text><path fill="none" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" marker-end="url(#a)" d="M140 86h60"/><rect width="140" height="48" x="200" y="62" fill="var(--bg-secondary, #1a1b26)" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" rx="6"/><text x="270" y="82" fill="var(--brand-purple, #7367f0)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">POLICY ENGINE</text><text x="270" y="98" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Verify all five pillars</text><path fill="none" stroke="#2ec97a" stroke-width="1.2" marker-end="url(#b)" d="M340 80h80"/><rect width="100" height="36" x="420" y="62" fill="var(--bg-secondary, #1a1b26)" stroke="#2ec97a" stroke-width="1.2" rx="6"/><text x="470" y="77" fill="#2ec97a" font-family="Space Grotesk,sans-serif" font-size="9" font-weight="700" text-anchor="middle">ACCESS</text><text x="470" y="91" fill="#2ec97a" font-family="Space Grotesk,sans-serif" font-size="9" font-weight="700" text-anchor="middle">GRANTED</text><path fill="none" stroke="#e24b4a" stroke-width="1.2" marker-end="url(#c)" d="m340 100 80 16"/><rect width="100" height="36" x="420" y="106" fill="var(--bg-secondary, #1a1b26)" stroke="#e24b4a" stroke-width="1.2" rx="6"/><text x="470" y="121" fill="#e24b4a" font-family="Space Grotesk,sans-serif" font-size="9" font-weight="700" text-anchor="middle">ACCESS</text><text x="470" y="135" fill="#e24b4a" font-family="Space Grotesk,sans-serif" font-size="9" font-weight="700" text-anchor="middle">DENIED</text><rect width="112" height="210" x="40" y="168" fill="var(--bg-secondary, #1a1b26)" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" rx="8"/><rect width="112" height="30" x="40" y="168" fill="var(--brand-purple, #7367f0)" opacity=".4" rx="8"/><path fill="var(--bg-secondary, #1a1b26)" d="M40 186h112v12H40z"/><text x="96" y="188" fill="var(--brand-purple, #7367f0)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">IDENTITY</text><text x="96" y="212" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">Foundation pillar</text><path stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" d="M56 220h80"/><text x="96" y="238" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Strong MFA</text><text x="96" y="254" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Phishing-resistant</text><text x="96" y="270" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Continuous verify</text><text x="96" y="286" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Session validation</text><text x="96" y="302" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">ITDR monitoring</text><text x="96" y="318" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Non-human IDs</text><text x="96" y="334" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Passkeys / FIDO2</text><text x="96" y="350" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Zero standing priv.</text><rect width="112" height="210" x="168" y="168" fill="var(--bg-secondary, #1a1b26)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="8"/><rect width="112" height="30" x="168" y="168" fill="none" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="8"/><text x="224" y="188" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">DEVICES</text><text x="224" y="212" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">Device health check</text><path stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" d="M184 220h80"/><text x="224" y="238" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Patch status</text><text x="224" y="254" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">EDR presence</text><text x="224" y="270" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Config compliance</text><text x="224" y="286" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Certificate valid</text><text x="224" y="302" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Posture at auth time</text><text x="224" y="318" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Not just enrollment</text><rect width="112" height="210" x="296" y="168" fill="var(--bg-secondary, #1a1b26)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="8"/><rect width="112" height="30" x="296" y="168" fill="none" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="8"/><text x="352" y="188" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">NETWORK</text><text x="352" y="212" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">Micro-segmentation</text><path stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" d="M312 220h80"/><text x="352" y="238" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">SDP / ZTNA</text><text x="352" y="254" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Encrypted E-W traffic</text><text x="352" y="270" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">No implicit trust</text><text x="352" y="286" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Limits blast radius</text><text x="352" y="302" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Not sufficient alone</text><rect width="112" height="210" x="424" y="168" fill="var(--bg-secondary, #1a1b26)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="8"/><rect width="112" height="30" x="424" y="168" fill="none" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="8"/><text x="480" y="188" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">APPLICATIONS</text><text x="480" y="212" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">App-layer access control</text><path stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" d="M440 220h80"/><text x="480" y="238" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Per-app policy</text><text x="480" y="254" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">JIT provisioning</text><text x="480" y="270" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Session monitoring</text><text x="480" y="286" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">No broad network access</text><text x="480" y="302" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Continuous auth</text><rect width="112" height="210" x="552" y="168" fill="var(--bg-secondary, #1a1b26)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="8"/><rect width="112" height="30" x="552" y="168" fill="none" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="8"/><text x="608" y="188" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">DATA</text><text x="608" y="212" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">Ultimate objective</text><path stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" d="M568 220h80"/><text x="608" y="238" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Classification</text><text x="608" y="254" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Rights management</text><text x="608" y="270" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Access logging</text><text x="608" y="286" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Exfil detection</text><text x="608" y="302" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">DLP enforcement</text><text x="608" y="318" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Encryption at rest</text><path fill="none" stroke="var(--brand-purple, #7367f0)" stroke-dasharray="3 2" stroke-width="1.2" d="M230 110 96 168m154-58-26 58m46-58 82 58m-62-58 190 58m-170-58 298 58" opacity=".9"/><text x="340" y="406" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Identity is highlighted because it is the load-bearing pillar. Weak identity makes all other pillars ineffective.</text><text x="340" y="422" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Zero Trust is a direction, not a destination. Start with the highest-risk access patterns, expand coverage over time.</text></svg>