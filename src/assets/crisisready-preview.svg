  <rect x="0" y="0" width="180" height="280" rx="10" class="bg" stroke-width="0.5" stroke="var(--color-border-tertiary,rgba(0,0,0,0.12))"/>
  <rect x="0" y="0" width="180" height="3" rx="2" fill="#7367f0"/>

  <!-- logo top-right (crisisready: shield + cross) -->
  <g transform="translate(146, 10) scale(0.367)">
    <path d="m51 14c-12.467-.005-18.034-7.609-19.551-10.17-.304-.514-.851-.83-1.449-.83s-1.144.316-1.449.83c-1.517 2.561-7.084 10.165-19.551 10.17-1.104 0-2 .896-2 2v11c0 19.096 16.575 27.645 20.951 29.568.649.285 1.341.432 2.049.432s1.4-.147 2.049-.432c4.376-1.923 20.951-10.472 20.951-29.568v-11c0-1.104-.896-2-2-2z" fill="url(#cr-logo-grad)"/>
    <circle cx="30" cy="30" r="12" fill="none" stroke="white" stroke-width="2.5"/>
    <line x1="30" y1="22" x2="30" y2="38" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="22" y1="30" x2="38" y2="30" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <text x="14" y="24" font-size="7" letter-spacing="1" class="t3">CRISISREADY · IRM</text>

