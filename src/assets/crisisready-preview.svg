  <rect x="14" y="252" width="28" height="10" rx="2" class="bg2" stroke-width="0.5" stroke="var(--color-border-tertiary,rgba(0,0,0,0.12))"/>
  <text x="19" y="260" font-size="6.5" class="t3">CISO</text>
  <rect x="46" y="252" width="32" height="10" rx="2" class="bg2" stroke-width="0.5" stroke="var(--color-border-tertiary,rgba(0,0,0,0.12))"/>
  <text x="51" y="260" font-size="6.5" class="t3">LEGAL</text>
  <rect x="82" y="252" width="24" height="10" rx="2" class="bg2" stroke-width="0.5" stroke="var(--color-border-tertiary,rgba(0,0,0,0.12))"/>
