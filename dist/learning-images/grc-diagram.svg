<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480"><defs><marker id="a" markerHeight="5" markerWidth="5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="var(--brand-purple, #7367f0)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="m2 1 6 4-6 4"/></marker></defs><path fill="var(--bg-primary, #0b0c0e)" d="M0 0h680v480H0z"/><text x="340" y="36" fill="var(--text-primary, #ffffff)" font-family="Space Grotesk,sans-serif" font-size="13" font-weight="700" text-anchor="middle">GRC — GOVERNANCE, RISK &amp; COMPLIANCE</text><text x="340" y="52" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="10" text-anchor="middle">Three disciplines that only work when integrated — not managed as separate programs</text><rect width="180" height="260" x="40" y="70" fill="var(--bg-secondary, #1a1b26)" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" rx="8"/><rect width="180" height="34" x="40" y="70" fill="var(--brand-purple, #7367f0)" opacity=".4" rx="8"/><path fill="var(--bg-secondary, #1a1b26)" d="M40 92h180v12H40z"/><text x="130" y="92" fill="var(--brand-purple, #7367f0)" font-family="Space Grotesk,sans-serif" font-size="12" font-weight="700" text-anchor="middle">GOVERNANCE</text><text x="130" y="118" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Who decides · Who&apos;s accountable</text><path stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" d="M56 126h148"/><text x="130" y="146" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Board risk oversight</text><text x="130" y="162" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Risk appetite statement</text><text x="130" y="178" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Policy ownership</text><text x="130" y="194" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Decision rights</text><text x="130" y="210" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Escalation paths</text><text x="130" y="226" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Exec reporting cadence</text><text x="130" y="242" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">RACI for risk decisions</text><text x="130" y="258" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Security strategy alignment</text><text x="130" y="274" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Business unit accountability</text><text x="130" y="290" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">CISO authority scope</text><text x="130" y="306" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Audit committee liaison</text><rect width="180" height="260" x="250" y="70" fill="var(--bg-secondary, #1a1b26)" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" rx="8"/><rect width="180" height="34" x="250" y="70" fill="var(--brand-purple, #7367f0)" opacity=".4" rx="8"/><path fill="var(--bg-secondary, #1a1b26)" d="M250 92h180v12H250z"/><text x="340" y="92" fill="var(--brand-purple, #7367f0)" font-family="Space Grotesk,sans-serif" font-size="12" font-weight="700" text-anchor="middle">RISK</text><text x="340" y="118" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">What could go wrong · How bad</text><path stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" d="M266 126h148"/><text x="340" y="146" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Risk identification</text><text x="340" y="162" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Quantification (ALE)</text><text x="340" y="178" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Risk register · Named owners</text><text x="340" y="194" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Accept · Mitigate · Transfer</text><text x="340" y="210" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Continuous monitoring</text><text x="340" y="226" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Third-party risk (TPRM)</text><text x="340" y="242" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Technical exposure (EASM)</text><text x="340" y="258" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Residual risk reporting</text><text x="340" y="274" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Tolerance thresholds</text><text x="340" y="290" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Scenario modelling</text><text x="340" y="306" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Cyber insurance alignment</text><rect width="180" height="260" x="460" y="70" fill="var(--bg-secondary, #1a1b26)" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="8"/><rect width="180" height="34" x="460" y="70" fill="none" stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" rx="8"/><text x="550" y="92" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="12" font-weight="700" text-anchor="middle">COMPLIANCE</text><text x="550" y="118" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Are you meeting the standard?</text><path stroke="var(--border-primary, #3a3c5a)" stroke-width="1.2" d="M476 126h148"/><text x="550" y="146" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">GDPR · CCPA</text><text x="550" y="162" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">ISO 27001 · SOC 2</text><text x="550" y="178" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">NIST CSF · PCI DSS</text><text x="550" y="194" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">SEC cyber disclosure</text><text x="550" y="210" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">DORA · NIS2</text><text x="550" y="226" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Evidence collection</text><text x="550" y="242" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Control testing</text><text x="550" y="258" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Audit management</text><text x="550" y="274" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Gap assessments</text><rect width="164" height="28" x="468" y="284" fill="var(--bg-primary, #0b0c0e)" stroke="#e24b4a" stroke-width="1.2" rx="4"/><text x="550" y="296" fill="#e24b4a" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">Compliance ≠ Security</text><text x="550" y="307" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="8" text-anchor="middle">It&apos;s a floor, not a ceiling</text><path fill="none" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" marker-end="url(#a)" d="M220 200h28" opacity=".9"/><path fill="none" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" marker-end="url(#a)" d="M430 200h28" opacity=".9"/><rect width="600" height="60" x="40" y="362" fill="var(--bg-secondary, #1a1b26)" stroke="var(--brand-purple, #7367f0)" stroke-width="1.2" rx="8"/><text x="340" y="382" fill="var(--brand-purple, #7367f0)" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" text-anchor="middle">BOARD REPORTING REQUIREMENT</text><text x="340" y="398" fill="var(--text-muted, #c6c5c5)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">SEC rules · DORA · Director liability · Post-breach litigation</text><text x="340" y="413" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">Boards are now legally accountable for risk oversight. GRC is how CISOs make that conversation possible.</text><text x="340" y="450" fill="var(--text-secondary, #5c5f70)" font-family="Space Grotesk,sans-serif" font-size="9" text-anchor="middle">GRC without integration produces silos. Integrated GRC produces a defensible, board-level risk position.</text></svg>