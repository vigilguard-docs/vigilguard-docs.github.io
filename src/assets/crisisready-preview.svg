  <rect x="14" y="215" width="76" height="5" rx="2" fill="#0096c7" opacity="0.65"/>

  <text x="14" y="230" font-size="7.5" class="t2">Recovery</text>
  <rect x="14" y="233" width="152" height="5" rx="2" class="bg2" stroke-width="0.5" stroke="var(--color-border-tertiary,rgba(0,0,0,0.12))"/>
  <rect x="14" y="233" width="30" height="5" rx="2" fill="#5ecaa5" opacity="0.65"/>

  <line x1="14" y1="246" x2="166" y2="246" stroke="var(--color-border-tertiary,rgba(0,0,0,0.12))" stroke-width="0.5"/>

